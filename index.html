<!DOCTYPE html>
<html lang="en" data-color-scheme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ownword — 官方组件改造版</title>
  <link rel="icon" type="image/svg+xml" href="brand/ownword-small.svg">
  <link rel="stylesheet" href="vendor/styles.css">
  <link rel="stylesheet" href="vendor/runtime.css">
</head>
<body class="s2">
  <div id="root" aria-busy="true"></div>
  <div id="boot-status" role="status" class="boot-screen"><img src="brand/ownword-mark.svg" alt="" width="40" height="40"><p>Loading Ownword…</p></div>
  <noscript>请启用 JavaScript 以使用原型。</noscript>
  <script>try{const theme=localStorage.getItem('ownword-astra-theme')||'light';document.documentElement.dataset.colorScheme=theme;document.documentElement.style.colorScheme=theme;document.documentElement.style.setProperty('--s2-color-scheme',theme);if(localStorage.getItem('ownword-astra-locale')==='zh')document.documentElement.lang='zh-CN';}catch{}</script>
  <script defer src="vendor/runtime.js" integrity="sha384-gsQgsGfMw3apCa6LDLiZ/XIl4cVDCsiHicTAup1hZEVX485rUZABoFID0u/AjizV" crossorigin="anonymous"></script>
</body>
</html>
