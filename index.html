  <!-- Static branding paints while React and the prototype dependencies load. -->
  <div id="root">
    <main class="boot-screen" role="status" aria-live="polite" aria-label="Loading Ownword">
      <div class="brand-loading" aria-hidden="true"><img class="brand-mark" src="brand/ownword-mark.svg" width="64" height="64" alt=""></div>
      <span class="boot-wordmark">ownword</span>
      <span class="boot-caption">Loading your space…</span>
    </main>
  </div>
  <noscript><style>.boot-screen { display: none; }</style>Enable JavaScript to open the Ownword prototype.</noscript>
  <script>
    try {
      if (localStorage.getItem('ownword-astra-theme') === 'dark') document.documentElement.dataset.colorScheme = 'dark';
      if (localStorage.getItem('ownword-astra-locale') === 'zh') {
        document.documentElement.lang = 'zh-CN';
        document.querySelector('.boot-screen').setAttribute('aria-label', '正在加载 Ownword');
        document.querySelector('.boot-caption').textContent = '正在载入你的空间…';
      }
    } catch (_) { /* Keep the default appearance when device storage is unavailable. */ }
  </script>
